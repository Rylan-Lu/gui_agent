[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gui-agent"
version = "0.1.0"
description = "Desktop GUI agent developed from scratch"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "mss>=10,<12",
    "numpy>=2,<3",
    "opencv-python>=4.10,<5",
    "easyocr>=1.2,<2"
    "pillow>=10,<12",
    "pyautogui>=0.9.54,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]