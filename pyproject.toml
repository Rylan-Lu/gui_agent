[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gui-agent"
version = "0.1.0"
description = "Desktop GUI agent with screen perception, OCR, UI localization, and control"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mss>=10,<12",
    "numpy>=2,<3",
    "opencv-contrib-python==4.10.0.84",
    "pillow>=10,<13",
    "pyautogui>=0.9.54,<1",
]

[project.optional-dependencies]
easyocr = ["easyocr==1.7.2"]
paddleocr = ["paddleocr==3.3.0"]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
